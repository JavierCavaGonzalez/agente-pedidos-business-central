[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-pedidos-business-central"
version = "0.1.0"
description = "Agente de pedidos de venta sobre Dynamics 365 Business Central construido con Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "agent-framework==1.22.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "typing_extensions>=4.12",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.21", "azure-monitor-opentelemetry>=1.8"]
mcp = ["mcp>=1.20"]
devui = ["agent-framework-devui"]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sse-starlette>=2.1,<4", "watchfiles>=0.24,<2"]

[project.scripts]
agente-pedidos = "agente_pedidos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
